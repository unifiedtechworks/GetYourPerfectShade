version: 1
frontend:
  phases:
    preBuild:
      commands:
        - |
          set -euo pipefail
          test "$AWS_BRANCH" = codex/compatibility-amplify-staging-fa8f343-20261030
          test "$PERFECT_SHADE_STAGING_VALIDATION_APPROVED" = fa8f343a6758c1802bdefa251b692b5e11442ca7
          test -z "${PERFECT_SHADE_PRODUCTION_RELEASE_APPROVED:-}"
          printf '%s  %s\n' 'cc124e7f81418e09720280539e45e862dd9056b13e794d889a0062bafc45bc97' 'release-candidates/compatibility-fa8f343a6758c1802bdefa251b692b5e11442ca7.bundle' | sha256sum --check --status
          git bundle verify release-candidates/compatibility-fa8f343a6758c1802bdefa251b692b5e11442ca7.bundle
          git fetch --no-tags ./release-candidates/compatibility-fa8f343a6758c1802bdefa251b692b5e11442ca7.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = fa8f343a6758c1802bdefa251b692b5e11442ca7
          git checkout --detach 3586e950500963be2707bb5da7182949e47b03d7
          test "$(git rev-parse HEAD^{tree})" = 3680b22bc568367190a1ffbab0a843c2ff6806c8
          git diff --exit-code HEAD
          test ! -e infra/database/migrations/0010_estimate_document_lifecycle_and_policy.sql
          node -e "require('node:fs').rmSync('.next', {recursive:true, force:true})"
          nvm install 22.23.1
          nvm use 22.23.1
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm install --frozen-lockfile --strict-peer-dependencies
          node --input-type=module -e "import { validateAmplifyEnvironment } from './scripts/validate-amplify-environment.mjs'; if(process.env.AWS_BRANCH!=='codex/compatibility-amplify-staging-fa8f343-20261030' || process.env.PERFECT_SHADE_PRODUCTION_RELEASE_APPROVED) throw Error('Invalid staging context'); validateAmplifyEnvironment({...process.env,AWS_BRANCH:'main',PERFECT_SHADE_DEPLOYMENT_ENVIRONMENT:'production',PERFECT_SHADE_PRODUCTION_RELEASE_APPROVED:'true'}); console.log('Production-compatible configuration validated in staging context; no production marker was set.');"
    build:
      commands:
        - test "$(git rev-parse HEAD)" = 3586e950500963be2707bb5da7182949e47b03d7
        - pnpm build
        - test "$(git rev-parse HEAD^{tree})" = 3680b22bc568367190a1ffbab0a843c2ff6806c8
    postBuild:
      commands:
        - node -e "require('node:fs').writeFileSync('.next/compatibility-release-provenance.json', JSON.stringify({commit:'3586e950500963be2707bb5da7182949e47b03d7',tree:'3680b22bc568367190a1ffbab0a843c2ff6806c8',node:process.version,linux:process.platform==='linux',actualBranch:process.env.AWS_BRANCH,bundleSha256:'cc124e7f81418e09720280539e45e862dd9056b13e794d889a0062bafc45bc97',migration0010Absent:!require('node:fs').existsSync('infra/database/migrations/0010_estimate_document_lifecycle_and_policy.sql')}))"
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths: []
